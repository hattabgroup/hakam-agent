name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  python-lint-and-check:
    name: Lint & Check Python Services
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api-service, auth-service, agent-service]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip flake8
          if [ -f ${{ matrix.service }}/requirements.txt ]; then
            pip install -r ${{ matrix.service }}/requirements.txt
          fi

      - name: Lint with flake8
        run: |
          # Stop build if there are Python syntax errors or undefined names
          flake8 ${{ matrix.service }} --count --select=E9,F63,F7,F82 --show-source --statistics
          # Treat all other errors as warnings
          flake8 ${{ matrix.service }} --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  node-build-check:
    name: Build Check Frontend & MCP
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            mcp-service/package-lock.json

      - name: Check MCP Service
        run: |
          cd mcp-service
          npm ci
          npm run build

      - name: Check Frontend Type Checking & Build
        run: |
          cd frontend
          npm ci
          npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8002
          API_URL: http://api-service:8000
          AUTH_SERVICE_URL: http://auth-service:8000

  docker-compose-validate:
    name: Validate Docker Compose Configurations
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Copy sample env
        run: cp .env.example .env

      - name: Validate Local Compose
        run: docker compose -f infra/docker-compose.yml config

      - name: Validate Prod Compose
        run: docker compose -f infra/docker-compose.prod.yml config
