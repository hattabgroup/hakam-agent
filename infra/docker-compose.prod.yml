services:
  # NGINX (Reverse Proxy & Auth)
  nginx:
    image: nginx:alpine
    container_name: hakam-router
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./htpasswd:/etc/nginx/htpasswd:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
      - api-service
    restart: always

  # Database
  db:
    image: mysql:8.0
    container_name: hakam-db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-hakam_db}
      MYSQL_USER: ${MYSQL_USER:-hakam_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-hakam_password}
    # ports:
    #   - "3306:3306" # Removed for security
    volumes:
      - hakam_db_data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  # Authentication Service
  auth-service:
    build: ../auth-service
    container_name: hakam-auth
    # ports:
    #   - "8001:8000" # Removed for security
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-hakam_user}:${MYSQL_PASSWORD:-hakam_password}@${MYSQL_HOST:-db}/${MYSQL_DATABASE:-hakam_db}
      JWT_SECRET: ${JWT_SECRET:-supersecretkeyForPhase2DevelopmentOnly}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ZEPTOMAIL_SMTP_HOST: ${ZEPTOMAIL_SMTP_HOST}
      ZEPTOMAIL_SMTP_PORT: ${ZEPTOMAIL_SMTP_PORT}
      ZEPTOMAIL_USERNAME: ${ZEPTOMAIL_USERNAME}
      ZEPTOMAIL_PASSWORD: ${ZEPTOMAIL_PASSWORD}
      ZEPTOMAIL_FROM_EMAIL: ${ZEPTOMAIL_FROM_EMAIL}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:3000}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  # API Service
  api-service:
    build: ../api-service
    container_name: hakam-api
    # ports:
    #   - "8002:8000" # Removed for security
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-hakam_user}:${MYSQL_PASSWORD:-hakam_password}@${MYSQL_HOST:-db}/${MYSQL_DATABASE:-hakam_db}
      JWT_SECRET: ${JWT_SECRET:-supersecretkeyForPhase2DevelopmentOnly}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL:-http://auth-service:8000}
      MCP_SERVICE_URL: ${MCP_SERVICE_URL:-http://mcp-service:8000}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY}
      INTERNAL_WORKER_SECRET: ${INTERNAL_WORKER_SECRET}
      API_BASE_URL: ${API_BASE_URL}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      STRIPE_PRICE_STARTER_MONTHLY: ${STRIPE_PRICE_STARTER_MONTHLY}
      STRIPE_PRICE_TEAM_MONTHLY: ${STRIPE_PRICE_TEAM_MONTHLY}
      STRIPE_PRICE_BUSINESS_MONTHLY: ${STRIPE_PRICE_BUSINESS_MONTHLY}
      STRIPE_PRICE_EXTRA_REPO_MONTHLY: ${STRIPE_PRICE_EXTRA_REPO_MONTHLY}
      STRIPE_PRICE_STARTER_YEARLY: ${STRIPE_PRICE_STARTER_YEARLY}
      STRIPE_PRICE_TEAM_YEARLY: ${STRIPE_PRICE_TEAM_YEARLY}
      STRIPE_PRICE_BUSINESS_YEARLY: ${STRIPE_PRICE_BUSINESS_YEARLY}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:3000}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  # Frontend (Next.js)
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        STRIPE_PRICE_STARTER_MONTHLY: ${STRIPE_PRICE_STARTER_MONTHLY}
        STRIPE_PRICE_TEAM_MONTHLY: ${STRIPE_PRICE_TEAM_MONTHLY}
        STRIPE_PRICE_BUSINESS_MONTHLY: ${STRIPE_PRICE_BUSINESS_MONTHLY}
        STRIPE_PRICE_EXTRA_REPO_MONTHLY: ${STRIPE_PRICE_EXTRA_REPO_MONTHLY}
        STRIPE_PRICE_STARTER_YEARLY: ${STRIPE_PRICE_STARTER_YEARLY}
        STRIPE_PRICE_TEAM_YEARLY: ${STRIPE_PRICE_TEAM_YEARLY}
        STRIPE_PRICE_BUSINESS_YEARLY: ${STRIPE_PRICE_BUSINESS_YEARLY}
        NEXT_PUBLIC_GOOGLE_ANALYTICS: ${NEXT_PUBLIC_GOOGLE_ANALYTICS}
    container_name: hakam-frontend
    # ports:
    #   - "3000:3000" # Removed for security
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8002
      API_URL: http://api-service:8000
      AUTH_SERVICE_URL: http://auth-service:8000
      STRIPE_PRICE_STARTER_MONTHLY: ${STRIPE_PRICE_STARTER_MONTHLY}
      STRIPE_PRICE_TEAM_MONTHLY: ${STRIPE_PRICE_TEAM_MONTHLY}
      STRIPE_PRICE_BUSINESS_MONTHLY: ${STRIPE_PRICE_BUSINESS_MONTHLY}
      STRIPE_PRICE_STARTER_YEARLY: ${STRIPE_PRICE_STARTER_YEARLY}
      STRIPE_PRICE_TEAM_YEARLY: ${STRIPE_PRICE_TEAM_YEARLY}
      STRIPE_PRICE_BUSINESS_YEARLY: ${STRIPE_PRICE_BUSINESS_YEARLY}
      NEXT_PUBLIC_GOOGLE_ANALYTICS: ${NEXT_PUBLIC_GOOGLE_ANALYTICS}
    # No volumes mapped (Use built image artifact)
    command: npm start
    depends_on:
      - api-service
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  # Agent Service
  agent-service:
    build: ../agent-service
    container_name: hakam-agent
    environment:
      API_URL: ${API_SERVICE_URL:-http://api-service:8000}
      INTERNAL_WORKER_SECRET: ${INTERNAL_WORKER_SECRET}
    depends_on:
      api-service:
        condition: service_healthy
    restart: always

  # MCP Service
  mcp-service:
    build: ../mcp-service
    container_name: hakam-mcp
    # ports:
    #   - "8003:8000" # Removed for security
    environment:
      AGENT_URL: http://agent-service:8000
    depends_on:
      - agent-service
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8000/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

volumes:
  hakam_db_data:
