events {
    worker_connections 1024;
}

http {
    # Frontend (Default) - Catches hakamlab.com and any unmatched traffic
    server {
        listen 80 default_server;
        server_name _;

        # Basic Auth
        auth_basic "Restricted Access";
        auth_basic_user_file /etc/nginx/htpasswd;

        location / {
            proxy_pass http://frontend:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support (Required for Next.js HMR)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    # Backend API - Catches api.* or explicit api domain
    server {
        listen 80;
        server_name api.hakamlab.com api.*;

        location / {
            proxy_pass http://api-service:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
